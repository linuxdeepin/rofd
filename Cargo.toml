[package]
rust-version.workspace = true
name = "rofd"
version = "0.4.0"
edition = "2021"
description = "An OFD parser and renderer library."
authors = ["HualetWang <hualet@hualet.org>"]
repository = "https://github.com/hualet/rofd"
license = "LGPL-2.1-or-later"

[features]
default = []
qt-reader = ["dep:qmetaobject", "dep:rofd-core", "dep:rofd-render", "dep:serde_json", "dep:base64"]

[dependencies]
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
cairo-rs = { version = "0.20.7", features = ["png"] }
env_logger = "0.11.6"
log = { version = "0.4.25", features = ["kv"] }
qmetaobject = { version = "0.2.10", optional = true }
rofd-core = { path = "crates/rofd-core", optional = true }
rofd-render = { path = "crates/rofd-render", optional = true }
serde = { version = "1.0.217", features = ["derive"] }
serde-xml-rs = { workspace = true }
zip = { workspace = true }

[[bin]]
name = "rofd"
path = "src/bin/rofd/main.rs"
required-features = ["qt-reader"]

[workspace]
members = [".", "crates/rofd-core", "crates/rofd-render", "crates/rofd-ffi", "tests/ofdrw-compat"]
default-members = ["crates/rofd-core", "crates/rofd-render", "crates/rofd-ffi"]
resolver = "2"

[workspace.package]
rust-version = "1.81"
edition = "2021"
license = "LGPL-2.1-or-later"
repository = "https://github.com/hualet/rofd"

[workspace.dependencies]
cairo-rs = { version = "0.20.7", features = ["freetype", "png"] }
pkg-config = "0.3"
fontdb = "0.23.0"
freetype-rs = "0.37.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff"] }
serde = { version = "1.0.217", features = ["derive"] }
serde-xml-rs = "0.6.0"
thiserror = "2.0.20"
xml-rs = "0.8.27"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
tiff = "0.9"
