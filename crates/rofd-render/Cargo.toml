[package]
name = "rofd-render"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Backend-neutral OFD display-list lowering and Cairo rendering"
build = "build.rs"

[features]
default = ["jbig2"]
# Decode JBIG2 (JB2/GBIG2) images through the system jbig2dec library,
# located with pkg-config like Cairo and FreeType.
jbig2 = []

[dependencies]
cairo-rs.workspace = true
fontdb.workspace = true
freetype-rs.workspace = true
image.workspace = true
rofd-core = { path = "../rofd-core" }
thiserror.workspace = true

[build-dependencies]
pkg-config.workspace = true

[dev-dependencies]
zip = { workspace = true, features = ["deflate"] }
tiff = { workspace = true }
